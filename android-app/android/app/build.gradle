apply plugin: 'com.android.application'

android {
    namespace "be.thoubaine.adhan"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "be.thoubaine.adhan"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // ⚠️ versionCode doit AUGMENTER a chaque version publiee : Android
        // refuse d'installer une version dont le numero est inferieur ou egal
        // a celui deja en place. C'est le seul numero qu il regarde.
        versionCode 11
        versionName "1.5.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Les bibliothèques AndroidX embarquent leurs traductions dans une
        // cinquantaine de langues. Cette application n'existe qu'en français.
        resConfigs "fr", "en"

        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // La cle permanente arrive par variables d environnement, jamais par un
    // fichier du depot : celui-ci est PUBLIC. Si elles sont absentes (build
    // sur une machine sans la cle), on retombe sur la signature de debogage
    // plutot que d echouer.
    signingConfigs {
        permanente {
            def chemin = System.getenv("ANDROID_KEYSTORE_FILE")
            if (chemin != null && file(chemin).exists()) {
                storeFile file(chemin)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                // PKCS12 n a qu un seul mot de passe, pour le magasin ET la cle.
                keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                storeType "PKCS12"
            }
        }
    }

    buildTypes {
        // R8 supprime le code jamais appele. Le gros du poids vient des
        // bibliotheques AndroidX, dont on n utilise qu une fraction.
        // proguard-rules.pro protege tout ce que Capacitor appelle par
        // reflexion : sans ces regles, l application s ouvrirait normalement
        // et le pont natif repondrait 'methode inconnue'.
        release {
            // Signee par la cle permanente si elle est fournie. C est ce qui
            // permet aux mises a jour de s installer PAR-DESSUS, sans
            // desinstaller ni perdre les reglages et le suivi des prieres.
            if (System.getenv("ANDROID_KEYSTORE_FILE") != null) {
                signingConfig signingConfigs.permanente
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        // On applique le MEME traitement au build de test : livrer un APK
        // reduit qu on n a jamais fait tourner reduit serait absurde. Ce qui
        // est teste doit etre ce qui est livre.
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        // Metadonnees de compilation Kotlin et licences : inutiles a
        // l execution.
        exclude "META-INF/*.kotlin_module"
        exclude "META-INF/*.version"
        exclude "DebugProbesKt.bin"
        exclude "kotlin/**"
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
