# =====================================================================
# Fabrique l'APK Adhan dans le cloud.
#
# La machine locale n'a AUCUN outil Android : tout se construit ici.
#
# Version de TEST : APK **debug**, signé avec la clé de débogage standard.
# Il s'installe et fonctionne — il suffit d'autoriser les « sources
# inconnues ». Aucun secret n'est donc nécessaire pour ce premier essai.
# Le jour où l'app se distribue pour de bon, on passera en release signé
# avec la clé permanente (secrets KEYSTORE_*).
# =====================================================================
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Les tests portent sur l'heure BELGE (changements d'heure, nuits d'été de
# Bruxelles). La machine de GitHub tourne en UTC : sans ce réglage, huit tests
# échouent pour une raison qui n'a rien à voir avec le code.
env:
  TZ: Europe/Brussels

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Le calcul des horaires est le cœur du produit : s'il est cassé,
      # aucune raison de fabriquer un APK.
      - name: Tests du moteur de calcul
        run: npm test

      - name: Dépendances de la coquille
        working-directory: android-app
        run: npm install --no-audit --no-fund

      - name: Préparer les fichiers embarqués
        run: node tools/build-android-assets.js

      - name: Synchroniser Capacitor
        working-directory: android-app
        run: npx cap sync android

      # La clé est reconstituée depuis le secret, utilisée, puis oubliée avec
      # la machine éphémère. Elle ne transite par aucun fichier du dépôt.
      - name: Reconstituer la clé de signature
        env:
          CLE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$CLE" ]; then
            echo "::error::Le secret ANDROID_KEYSTORE_BASE64 est absent."
            echo "Sans lui l'APK serait signée par une clé de débogage jetable,"
            echo "et ne pourrait pas remplacer la version déjà installée."
            exit 1
          fi
          echo "$CLE" | base64 -d > "$RUNNER_TEMP/adhan-release.p12"
          echo "magasin reconstitué : $(stat -c%s "$RUNNER_TEMP/adhan-release.p12") octets"

      - name: Construire l APK
        working-directory: android-app/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/adhan-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      # ⚠️ Gradle nomme le fichier « app-release-unsigned.apk » quand la
      # signature a échoué. Livrer ce fichier-là serait pire que de ne rien
      # livrer : il s'installe, puis refuse toute mise à jour ultérieure.
      - name: Vérifier que l'APK est bien signée
        run: |
          DOSSIER=android-app/android/app/build/outputs/apk/release
          ls -l "$DOSSIER"
          if [ -f "$DOSSIER/app-release-unsigned.apk" ]; then
            echo "::error::APK NON SIGNÉE — la clé permanente n'a pas été prise en compte."
            exit 1
          fi
          test -f "$DOSSIER/app-release.apk" || { echo "::error::aucune APK produite"; exit 1; }
          mkdir -p out
          cp "$DOSSIER/app-release.apk" out/adhan.apk
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: adhan-apk
          path: out/adhan.apk
          retention-days: 30
