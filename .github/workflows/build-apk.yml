# =====================================================================
# Fabrique l'APK Adhan dans le cloud.
#
# La machine locale n'a AUCUN outil Android : tout se construit ici.
#
# Version de TEST : APK **debug**, signé avec la clé de débogage standard.
# Il s'installe et fonctionne — il suffit d'autoriser les « sources
# inconnues ». Aucun secret n'est donc nécessaire pour ce premier essai.
# Le jour où l'app se distribue pour de bon, on passera en release signé
# avec la clé permanente (secrets KEYSTORE_*).
# =====================================================================
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Le calcul des horaires est le cœur du produit : s'il est cassé,
      # aucune raison de fabriquer un APK.
      - name: Tests du moteur de calcul
        run: npm test

      - name: Dépendances de la coquille
        working-directory: android-app
        run: npm install --no-audit --no-fund

      - name: Préparer les fichiers embarqués
        run: node tools/build-android-assets.js

      - name: Synchroniser Capacitor
        working-directory: android-app
        run: npx cap sync android

      - name: Construire l'APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renommer
        run: |
          mkdir -p out
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk out/adhan.apk
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: adhan-apk
          path: out/adhan.apk
          retention-days: 30
